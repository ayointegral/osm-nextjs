pid /var/run/nginx.pid;
worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # Temp paths configuration
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    # Tile proxy cache
    proxy_cache_path /var/cache/nginx/tile_cache
        levels=1:2
        keys_zone=tile_cache:10m
        max_size=10g
        inactive=365d
        use_temp_path=off;

    # Open file cache for tile serving
    open_file_cache max=5000 inactive=90d;
    open_file_cache_valid 30d;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;

    # Upstream configuration
    upstream nextjs_upstream {
        server webapp:3000;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Enable gzip compression
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_vary on;
        gzip_types
            application/javascript
            application/json
            application/x-javascript
            application/xml
            text/css
            text/javascript
            text/plain
            text/xml;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy"}';
        }

        # OSM tile viewer routes
        location /tile-viewer {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow all headers and methods for Next.js API routes
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' '*';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Proxy Next.js application
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Tier 1: Serve local tiles from disk (fastest, <1ms)
        location ~ ^/api/tiles/(\d+)/(\d+)/(\d+)$ {
            root /data;
            try_files /tiles/$1/$2/$3.png @tile_proxy;

            default_type image/png;
            add_header Content-Type "image/png" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Tile-Source "local-disk" always;
            add_header X-Cache-Status "LOCAL" always;
            add_header Access-Control-Allow-Origin "*" always;
            expires 365d;
            access_log off;
        }

        # Tier 2+3: Proxy cache then Next.js API -> OSM CDN
        location @tile_proxy {
            internal;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache tile_cache;
            proxy_cache_key "$uri";
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 1h;
            proxy_cache_valid 500 502 503 504 30s;
            proxy_cache_min_uses 1;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_lock_age 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_revalidate on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Tile-Source "proxy-cache" always;
            add_header Cache-Control "public, max-age=7776000, stale-while-revalidate=86400" always;
            add_header Access-Control-Allow-Origin "*" always;

            proxy_connect_timeout 10s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            proxy_intercept_errors on;
            error_page 404 500 502 503 504 = @error_tile;
            access_log off;
        }

        # Error tile handler
        location @error_tile {
            add_header Content-Type image/svg+xml;
            return 200 '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><rect width="256" height="256" fill="#ffffff"/><g><text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui" font-size="14" fill="#dc2626">Unable to load tile</text><text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui" font-size="12" fill="#6b7280">This style may not support</text><text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui" font-size="12" fill="#6b7280">the current zoom level</text></g></svg>';
        }

        # Static files caching
        location /_next/static {
            proxy_pass http://nextjs_upstream;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 60m;
            proxy_cache_valid 404 1m;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # Handle Next.js image optimization
        location /_next/image {
            proxy_pass http://nextjs_upstream;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 60m;
            proxy_cache_valid 404 1m;
        }
    }
}
