pid /var/run/nginx.pid;
worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # Temp paths configuration
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    # Open file cache for tile serving
    open_file_cache max=5000 inactive=90d;
    open_file_cache_valid 30d;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;

    # Upstream configuration
    upstream nextjs_upstream {
        server webapp:3000;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Enable gzip compression
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_vary on;
        gzip_types
            application/javascript
            application/json
            application/x-javascript
            application/xml
            text/css
            text/javascript
            text/plain
            text/xml;

        # Security headers — air-gapped, no external resources allowed
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;

        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy"}';
        }

        # OSM tile viewer routes
        location /tile-viewer {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tile serving — direct from disk, air-gapped (no external requests)
        location ~ ^/osm/(\d+)/(\d+)/(\d+)\.png$ {
            root /data;
            try_files /tiles/$1/$2/$3.png /tiles/placeholder.png =204;

            default_type image/png;
            add_header Content-Type "image/png" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Tile-Source "nginx-direct" always;
            expires 365d;
            access_log off;
        }

        # Tile API fallback — serves from disk via Next.js (for tiles not caught by /osm/)
        location ~ ^/api/tiles/(\d+)/(\d+)/(\d+)$ {
            root /data;
            try_files /tiles/$1/$2/$3.png @nextjs_tile;

            default_type image/png;
            add_header Content-Type "image/png" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Tile-Source "local-disk" always;
            expires 365d;
            access_log off;
        }

        location @nextjs_tile {
            internal;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Proxy Next.js application
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static files caching
        location /_next/static {
            proxy_pass http://nextjs_upstream;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 60m;
            proxy_cache_valid 404 1m;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # Handle Next.js image optimization
        location /_next/image {
            proxy_pass http://nextjs_upstream;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 60m;
            proxy_cache_valid 404 1m;
        }
    }
}
